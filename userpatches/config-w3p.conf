# See build framework documentation for a detailed explanation of all available switches:
# https://docs.armbian.com/Developer-Guide_Build-Switches/

# This Web3 Pi Solo Staking OS config file can be issue by running
# ./compile.sh w3p
# and will output a ready to run image as described below

BOARD=rpi4b-w3p                     # Build something for the Raspberry Pi 4B as further specified below
BRANCH=current                      # Use _current_ branch which equals to latest available Linux LTS kernel
RELEASE=resolute                    # Ubuntu 26.04 LTS "Resolute Raccoon" userspace (supported until 2031-04)
# Ubuntu 24.04 LTS - noble
# Ubuntu 25.04     - plucky (EOL 2026-01, Armbian status: eos)
# Ubuntu 26.04 LTS - resolute
BUILD_DESKTOP=no                    # Do not install a graphical desktop environment
BUILD_MINIMAL=yes                   # !Install common CLI utils
KERNEL_CONFIGURE=no                 # skip dialog prompt for adjusting the Linux kernel configuration
KERNEL_BTF=no                       # Skip BTF/eBPF info; Docker Desktop on macOS rarely has >8 GiB RAM for the LD/BTF step
INSTALL_HEADERS=no                  # Install Linux kernel headers while building. Can be useful for 3rd party drivers (+330MB.img/+50MB.img.xz)
NETWORKING_STACK="systemd-networkd" # https://docs.armbian.com/Developer-Guide_Build-Switches/#networking

# ToDo: Improved locale handling
LOCALE_DEFAULT="en_US.UTF-8"
KEYBOARD="us"
DEST_LANG="en_US.UTF-8"             # sl_SI.UTF-8, en_US.UTF-8
CONSOLE_CHAR="UTF-8"                # console charset
TZDATA="Europe/Warsaw"              # time zone

SHARE_LOGS=no                       # Upload logs to Armbian's paste service to share with developers
PREFER_DOCKER=yes                   # Prefer Docker for building the image
DOCKER_ARMBIAN_BASE_IMAGE="ubuntu:noble"
#CI=yes                             # Enable CI mode, which is used by the Armbian build service
CONSOLE_AUTOLOGIN=no                # Do not enable autologin on the console
VENDORPRETTYNAME="Web3 Pi Staking"  # Custom banner name for MOTD
OPENSSHD_REGENERATE_HOST_KEYS=no    # Disable SSH key regeneration in armbian-firstrun (handled by ssh-keygen.service)

#COMPRESS_OUTPUTIMAGE="xz"          # Compress the output image to save space
#IMAGE_XZ_COMPRESSION_RATIO=9       # Use maximum compression ratio for xz

# Kernel config deltas (survive upstream kernel-config updates, unlike in-tree edits)
function custom_kernel_config__enable_inet_diag_destroy() {
	# SOCK_DESTROY netlink op: required for `ss -K` used by the M5 internet-failover
	# watchdog to abort stale TCP sockets after a WAN flip. Absent from upstream
	# bcm2711 configs (INET_DIAG=m only). Verify on device: grep INET_DIAG_DESTROY /boot/config-*
	kernel_config_modifying_hashes+=("CONFIG_INET_DIAG_DESTROY=y")
	# Hook also runs during artifact version hashing, before the kernel tree exists;
	# only touch scripts/config in the real configuration phase (same guard as upstream
	# custom_kernel_config hooks, e.g. spacemit.conf).
	if [[ -f .config ]]; then
		kernel_config_set_y CONFIG_INET_DIAG_DESTROY
	fi
}

function custom_kernel_config__disable_misc_rp1() {
	# Pi5 ships TWO RP1 southbridge drivers: MFD_RP1 (drivers/mfd/rp1.c, the one
	# that works — binds 0002:01:00.0 and brings up ethernet/xhci/gpio/uart) and
	# MISC_RP1 (drivers/misc/rp1/rp1_pci.c, a runtime rp1.dtbo overlay loader).
	# The misc one can't resolve 'clk_rp1_xosc' against our DTB and fails probe
	# with -22 on every boot — a user-visible dmesg error with zero function
	# behind it (verified on HW 2026-07-17: all RP1 peripherals healthy via the
	# MFD driver). Drop it. Verify on device: dmesg | grep rp1_pci -> silent.
	kernel_config_modifying_hashes+=("CONFIG_MISC_RP1=n")
	if [[ -f .config ]]; then
		kernel_config_set_n CONFIG_MISC_RP1
	fi
}