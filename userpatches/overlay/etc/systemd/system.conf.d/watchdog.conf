[Manager]
# Hardware watchdog: systemd pings /dev/watchdog every 15s (half of 30s)
# If systemd stops responding (kernel panic, deadlock, hard hang),
# the hardware watchdog triggers a reset after 30s of missed pings.
RuntimeWatchdogSec=30

# If a reboot hangs for 10 minutes, force a hardware reset.
# Protects against shutdown/reboot getting stuck.
RebootWatchdogSec=10min
