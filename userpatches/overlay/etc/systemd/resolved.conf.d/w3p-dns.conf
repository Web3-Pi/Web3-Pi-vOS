# Web3 Pi — M5 internet-failover DNS strategy (plan v2 §4.4).
# Per-link DHCP DNS is disabled on every WAN (netplan use-dns=false); global
# anycast resolvers below are reachable via whichever WAN currently holds the
# default route, so resolution never sticks to a dead link's LAN resolver.
# Cost: LAN-local hostnames stop resolving — irrelevant for this appliance.
[Resolve]
DNS=1.1.1.1 9.9.9.9
FallbackDNS=8.8.8.8 149.112.112.112
Domains=~.
