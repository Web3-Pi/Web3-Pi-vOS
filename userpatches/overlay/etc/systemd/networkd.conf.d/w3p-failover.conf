# Web3 Pi — M5 internet-failover route-ownership contract (plan v2 §4.2).
# networkd owns the baseline metric ladder (netplan 20-w3p-failover.yaml);
# the failover watchdog expresses "force link X active" only by adding an
# override default route at metric 50. With ManageForeignRoutes=no networkd
# never touches that override on reload/renew — and never cleans up a stale
# one either: the watchdog's reconcile loop is the only janitor.
[Network]
ManageForeignRoutes=no
