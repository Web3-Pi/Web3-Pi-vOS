#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    # ===================
    # INPUT - incoming connections
    # ===================
    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback (required for EL<->CL communication)
        iif lo accept

        # Established/related (responses to our connections)
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # SSH with rate limiting
        tcp dport 22 ct state new limit rate 5/minute accept

        # Geth P2P (Execution Layer)
        tcp dport 30303 accept
        udp dport 30303 accept

        # Nimbus P2P (Consensus Layer)
        tcp dport 9000 accept
        udp dport 9000 accept
    }

    # ===================
    # OUTPUT - outgoing connections
    # ===================
    chain output {
        type filter hook output priority 0; policy drop;

        # Loopback
        oif lo accept

        # Established/related
        ct state established,related accept

        # Geth P2P - REQUIRED
        tcp dport 30303 accept
        udp dport 30303 accept

        # Nimbus P2P - REQUIRED
        tcp dport 9000 accept
        udp dport 9000 accept

        # DNS - open to all (DHCP compatibility)
        udp dport 53 accept
        tcp dport 53 accept

        # NTP (chrony) - REQUIRED for attestations
        udp dport 123 accept

        # HTTPS/HTTP - for apt updates, checkpoint sync
        tcp dport 443 accept
        tcp dport 80 accept
    }

    # ===================
    # FORWARD - block all
    # ===================
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
