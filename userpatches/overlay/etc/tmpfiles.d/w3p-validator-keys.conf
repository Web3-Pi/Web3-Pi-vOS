# Validator-keystore staging directory for the ethereum user.
#
# The control panel imports keys from here and instructs users to
# `scp keystore-*.json ethereum@<ip>:~/validator_keys/` BEFORE opening the
# import menu, so the directory must exist out of the box. The build-time
# mkdir in customize-image.sh did not survive image assembly on some builds,
# so guarantee it here: systemd-tmpfiles (re)creates it early on every boot
# with the right owner/mode. `d` never touches existing contents, so keys the
# user already copied in are preserved.
d /home/ethereum/validator_keys 0700 ethereum ethereum - -
