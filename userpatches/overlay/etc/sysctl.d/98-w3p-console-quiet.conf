# Keep the HDMI console clean for the user-facing dashboard: stop printing
# err-level kernel messages to the console (journald still records them all).
# Trigger case: wpa_supplicant scanning for an absent WiFi AP floods the
# console with brcmfmac chanspec errors every ~10 s — normal life for a
# failover rung whose AP is down.
kernel.printk = 3 4 1 3
