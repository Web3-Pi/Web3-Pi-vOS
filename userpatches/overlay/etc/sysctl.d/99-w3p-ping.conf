# Allow unprivileged ICMP echo (ping) for all users/groups.
# The mmdebstrap-built rootfs can miss the cap_net_raw file capability on
# /usr/bin/ping; ICMP datagram sockets sidestep that entirely. Also required
# for user-level connectivity checks documented in the failover guide.
net.ipv4.ping_group_range = 0 2147483647
