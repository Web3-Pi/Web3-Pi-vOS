# Web3 Pi internet failover — /etc/w3p-failover.conf (root:600).
# Sourced by the root watchdog daemon and edited via the control panel.
# Lives in /etc on purpose: /opt/web3pi is ethereum-writable (a sourced
# config there would be root code-execution for the ethereum user), and the
# main /opt/web3pi/config is rewritten from a fixed template on every
# control-panel save, silently dropping unknown keys (lib/common.sh).

# Two probe anchors, different providers, IPs only (no DNS dependency).
FAILOVER_ANCHORS="1.1.1.1 9.9.9.9"

# Layer 2 nudge: abort TCP sockets pinned to the old source IP after a flip
# so geth/nimbus redial immediately instead of waiting out TCP timeouts.
FAILOVER_NUDGE=1

# Egress cap (kbit/s) applied on the LTE interface while it carries traffic.
# Anti-bufferbloat, NOT a data-saving tool: an under-sized cap starves gossip
# upload, gossipsub peers prune the node and attestations stop propagating
# (observed live 2026-07-04: cap 4500 on a 20 Mbit uplink -> CL peers 2-3,
# "Attestation not sent: No peers on libp2p topic"). Size it near the link's
# measured upload (panel F->8); owner default for the Play bench: 20 Mbit.
CAKE_KBIT=20000

# Attestation-risk alarm: when the validator service is active and the CL
# peer count stays below this for 60 s, raise attest_risk in status.json
# (a "synced" node with a starved mesh signs attestations nobody hears).
ATTEST_MIN_PEERS=6

# Documented product minimum for failover duty (Mbit/s): below this an
# Ethereum node cannot stay healthy on the link. Used by the control-panel
# speed test verdict (owner decision 2026-07-02: 20/5; raised to 20 down
# / 10 up 2026-07-06).
MIN_DOWN_MBIT=20
MIN_UP_MBIT=10

# Reserved: modem web UI password for authenticated JSON API commands
# (read-only telemetry works without it on stock MF79U firmware).
#MODEM_PASSWORD=
